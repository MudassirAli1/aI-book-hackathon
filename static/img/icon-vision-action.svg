<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Eye for vision -->
  <circle cx="50" cy="40" r="15" fill="#3498db"/>
  <circle cx="50" cy="40" r="8" fill="white"/>
  <circle cx="52" cy="38" r="4" fill="#2c3e50"/>
  <!-- Camera lens -->
  <circle cx="50" cy="40" r="20" fill="none" stroke="#7f8c8d" stroke-width="2"/>
  <!-- Action arm -->
  <path d="M50,55 L50,80 L40,90" stroke="#2ecc71" stroke-width="5" stroke-linecap="round"/>
  <path d="M50,80 L60,90" stroke="#2ecc71" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand gripper -->
  <path d="M40,90 L35,95" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M60,90 L65,95" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <!-- Connection line -->
  <path d="M50,55 Q55,60 50,65 Q45,60 50,55" stroke="#e74c3c" stroke-width="2" fill="none"/>
</svg>