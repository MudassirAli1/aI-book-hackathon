<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="45" fill="#3498db"/>

  <!-- Circuit pattern -->
  <path d="M30,35 H45 V40 H55 V45 H65" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M30,65 H40 V60 H50 V55 H60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- AI brain-like shape in the center -->
  <path d="M40,45 C35,40 40,30 50,30 C60,30 65,40 60,45 C65,50 60,60 50,60 C40,60 35,50 40,45 Z" fill="white"/>

  <!-- Small connection dots -->
  <circle cx="35" cy="40" r="2" fill="white"/>
  <circle cx="65" cy="40" r="2" fill="white"/>
  <circle cx="35" cy="60" r="2" fill="white"/>
  <circle cx="65" cy="60" r="2" fill="white"/>
</svg>