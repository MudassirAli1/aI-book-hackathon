<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Humanoid robot body -->
  <rect x="40" y="30" width="20" height="30" fill="#9b59b6"/>
  <!-- Head -->
  <circle cx="50" cy="25" r="8" fill="#9b59b6"/>
  <!-- Arms -->
  <line x1="35" y1="40" x2="40" y2="40" stroke="#9b59b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="65" y2="40" stroke="#9b59b6" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="45" y1="60" x2="45" y2="75" stroke="#9b59b6" stroke-width="5" stroke-linecap="round"/>
  <line x1="55" y1="60" x2="55" y2="75" stroke="#9b59b6" stroke-width="5" stroke-linecap="round"/>
  <!-- AI integration -->
  <path d="M35,20 H65" stroke="#f1c40f" stroke-width="3"/>
  <path d="M50,15 V35" stroke="#f1c40f" stroke-width="3"/>
  <!-- Circuit details -->
  <circle cx="45" cy="35" r="2" fill="#f1c40f"/>
  <circle cx="55" cy="35" r="2" fill="#f1c40f"/>
  <circle cx="50" cy="50" r="2" fill="#f1c40f"/>
</svg>