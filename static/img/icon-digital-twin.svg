<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Real world representation -->
  <rect x="15" y="40" width="30" height="40" rx="4" fill="#3498db"/>
  <circle cx="30" cy="30" r="8" fill="#3498db"/>
  <!-- Digital twin representation -->
  <rect x="55" y="40" width="30" height="40" rx="4" fill="#9b59b6" opacity="0.7"/>
  <circle cx="70" cy="30" r="8" fill="#9b59b6" opacity="0.7"/>
  <!-- Connection between twins -->
  <path d="M45,50 C50,40 55,40 60,50" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <path d="M45,70 C50,80 55,80 60,70" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <!-- Sync indicators -->
  <circle cx="50" cy="50" r="2" fill="#e74c3c"/>
  <circle cx="60" cy="50" r="2" fill="#e74c3c"/>
</svg>