<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Network of nodes -->
  <circle cx="30" cy="30" r="10" fill="#2ecc71"/>
  <circle cx="70" cy="30" r="10" fill="#2ecc71"/>
  <circle cx="50" cy="70" r="10" fill="#2ecc71"/>
  <!-- Connections -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#3498db" stroke-width="3"/>
  <line x1="30" y1="30" x2="50" y2="70" stroke="#3498db" stroke-width="3"/>
  <line x1="70" y1="30" x2="50" y2="70" stroke="#3498db" stroke-width="3"/>
  <!-- Central hub -->
  <circle cx="50" cy="50" r="15" fill="#e74c3c"/>
  <!-- Topic arrows -->
  <path d="M50,35 L55,40 L45,40 Z" fill="white"/>
  <path d="M35,45 L40,50 L30,50 Z" fill="white"/>
  <path d="M65,45 L70,50 L60,50 Z" fill="white"/>
</svg>